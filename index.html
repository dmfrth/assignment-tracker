<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- adjusts the page to fit the width of the device screen -->
    <title>Assignment Tracker</title> <!-- title displayed in browser tab -->
    <link rel="stylesheet" href="style.css"> <!-- connects html to  stylesheet -->
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1 class="brand">Assignment Tracker</h1>
        <p>Keep track of your assignments and deadlines.</p>

        <nav class="nav" aria-label="Main-navigation"> <!-- place to add navigation links to the different sections of the page -->
            <ul>
                <li><a href="#add-assignment">Add Assignment</a></li> <!-- jumps to section where you fill out the assignment form -->
                <li><a href="#my-assignments">My Assignments</a></li> <!-- jumps to the section where your assignment list lives -->
            </ul>
        </nav>
    </header>

    <main>
        <div class="cards"> <!-- a collective class for the main cards so we can change layouts with grid -->

            <!-- card 1 collects a new assignment from the user-->
             <section class="card" id="add-assignment" aria-labelledby="add-heading">
                <h2 id="add-heading">Add Assignment</h2>

                <form id="assignment-form">
                    <div class="form-field">
                        <label for="assignment-name">Assignment Name:</label> <!-- heading for the assignment add form -->
                        <input type="text" id="assignment-name" name="name" required>
                    </div>

                    <!-- maybe have a dropdown for course selection in the future? -->
                     <div class="form-field"> <!-- lets user enter course name -->
                        <label for="course">Course:</label>
                        <input type="text" id="course" name="course" required>
                     </div>

                     <div class="form-field"> <!-- lets user enter assignment due date -->
                        <label for="due-date">Due Date:</label> 
                        <input type="date" id="due-date" name="dueDate" required> <!-- type=date allows the user to choose the date from a date picker -->
                     </div>

                     <button type="submit">Add Assignment</button> <!-- submits the form and triggers the submit event in .js file -->
                </form>
             </section>

             <!-- displays assignments entered by the user -->
             <section class="card" id="my-assignments" aria-labelledby="list-heading">
                <h2 id="list-heading">My Assignments</h2> <!-- heading for assignment list -->

                <div class="filter-field"> <!-- code for the dropdown menu selections -->
                    <label for="filter">Show:</label>
                    <select id="filter" name="filter">
                        <option value="all">All</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <p id="status-message" aria-live="polite">Your assignments will appear below.</p> <!-- this message will be updated once an assignment is uploaded -->
                <ul id="assignment-list"></ul>
             </section>

        </div>
    </main>

    <!-- displays text at the bottom of the page -->
    <footer>
        <p>Created by Danielle Forth and Ryan Sobocienski</p>
    </footer>

</body>
</html>
