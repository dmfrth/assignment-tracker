<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment Tracker</title>

    <!--This links the html file to the style sheet so we can change
    what things look like on the website-->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- The top of our website -->
    <header>
        <h1>Assignment Tracker</h1>
        <p>Keep track of your assignments and due dates.</p>
    </header>

    <!-- The main content of our website -->
    <main>

        <!-- Section for adding a new assignment -->
        <section>
            <h2>Add Assignment</h2> <!-- Label for what this section is for-->

            <form> <!--Use this to collect assignments from user and submit to the server-->
           
            <!--The label tells the user what we want for input-->
                <label for="assignment-name">Assignment Name:</label>

            <!--This creates the box where the user types their input-->
                <input type="text" id="assignment-name">

            <!--Lets the user type in the course name for the assignment (add a dropdown menu later instead?)-->
                <label for="course">Course:</label>
                <input type="text" id="course">

            <!--We use type="date" here instead of text so the user can select the date from a date picker rather than typing
            in the date, allows for less user error-->
                <label for="due-date">Due Date:</label>
                <input type="date" id="due-date">

            <!--this button allows the user to submit the form they just filled out. works now, that
            function has been added in the script.js file-->
                <button type="submit">Add Assignment</button>

            </form>
        </section>

        <!-- Section for displaying assignments -->
        <section>
            <h2>My Assignments</h2>

            <div id = "assignment-list"> <!--gives the script file a container to save new assignments-->
                <p>Your assignments will appear here.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script> <!-- connects this index.html file to the script file-->


</body>

</html>
